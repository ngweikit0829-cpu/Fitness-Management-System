<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='icon.avif') }}" type="image/avif">
  <title>注册 · 练迹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <header class="site">
    <div class="wrap nav">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="mark"><img src="{{ url_for('static', filename='icon.avif') }}" alt=""></span>
        练迹 <small>TRAINFLOW</small>
      </a>
      <nav class="nav-links"><a href="{{ url_for('index') }}">首页</a></nav>
      <a href="{{ url_for('login') }}" class="nav-cta">登录</a>
    </div>
  </header>

  <div class="auth-wrap">
    <form class="auth-card" action="{{ url_for('register') }}" method="POST" autocomplete="off">
      <h1>创建账号</h1>
      <p class="sub">注册后先完善一次身体档案</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}" style="color: var(--coral); margin-bottom: 12px; font-weight: 500;">
        {{ message }}
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" placeholder="设置一个用户名" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="至少 8 位字符" required>
      </div>
      <div class="field">
        <label for="confirm_password">确认密码</label>
        <input id="confirm_password" name="confirm_password" type="password" placeholder="再次输入密码" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="age">年龄</label>
          <input id="age" name="age" type="number" min="10" max="120" required>
        </div>
        <div class="field">
          <label for="gender">性别</label>
          <select id="gender" name="gender" required>
            <option value="" selected disabled>请选择性别</option>
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="height">身高 (cm)</label>
          <input id="height" name="height" type="number" min="50" max="250" step="0.1" required>
        </div>
        <div class="field">
          <label for="initial_weight">体重 (kg)</label>
          <input id="initial_weight" name="initial_weight" type="number" min="20" max="300" step="0.1" required>
        </div>
      </div>

      <div class="field">
        <label for="activity_level">活动量等级</label>
        <select id="activity_level" name="activity_level" required>
          <option value="" selected disabled>请选择活动量等级</option>
          <option value="sedentary">静坐（几乎不运动）</option>
          <option value="light">轻度运动（每周 1-3 次）</option>
          <option value="moderate">中度运动（每周 3-5 次）</option>
          <option value="active">重度运动（每周 6-7 次）</option>
          <option value="very_active">极高强度（体力工作 + 高频训练）</option>
        </select>
      </div>

      <div class="field">
        <label for="fitness_goal">健身目标</label>
        <select id="fitness_goal" name="fitness_goal" required>
          <option value="" selected disabled>请选择健身目标</option>
          <option value="cut">减脂</option>
          <option value="maintain">维持</option>
          <option value="bulk">增肌</option>
        </select>
      </div>

      <button type="submit" class="btn-primary btn-block">注册并生成我的计划</button>
      <div class="auth-switch">已经有账号？<a href="{{ url_for('login') }}">直接登录</a></div>
    </form>
  </div>

  <footer class="site-footer">
    <div class="wrap foot-row">
      <a href="{{ url_for('index') }}" class="brand"><span class="mark"><img
            src="{{ url_for('static', filename='icon.avif') }}" alt=""></span>练迹</a>
      <span>新纪元技职与推广教育学院 · Python Programming 课程项目</span>
    </div>
  </footer>

</body>

</html>
