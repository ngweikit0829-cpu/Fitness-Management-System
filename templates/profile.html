<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='icon.avif') }}" type="image/avif">
  <title>个人档案 · 练迹</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <header class="app">
    <div class="wrap app-nav">
      <a href="{{ url_for('dashboard') }}" class="brand"><span class="mark"><img
            src="{{ url_for('static', filename='icon.avif') }}" alt=""></span>练迹</a>
      <nav class="app-links">
        <a href="{{ url_for('dashboard') }}">仪表盘</a>
        <a href="{{ url_for('diet') }}">饮食推荐</a>
        <a href="{{ url_for('exercises') }}">动作库</a>
        <a href="{{ url_for('log') }}">每日打卡</a>
        <a href="{{ url_for('analytics') }}">数据分析</a>
        <a href="{{ url_for('report') }}">报告导出</a>
      </nav>
      <div class="user-chip"><span class="dot">{{ session['username'][0].upper() }}</span>{{ session['username'] }}<a
          href="{{ url_for('logout') }}" class="logout-link" style="margin-left:14px;">退出</a></div>
    </div>
  </header>

  <main class="app-main">
    <div class="wrap page-head">
      <div class="kicker">第一步</div>
      <h1>完善你的身体档案</h1>
      <p>这些信息用于计算 BMI、BMR、TDEE 与每日目标热量，之后可以随时修改。</p>
    </div>

    <div class="wrap">
      <form class="card" style="max-width:680px;" action="{{ url_for('profile') }}" method="POST">

        <div class="field-row">
          <div class="field">
            <label>性别</label>
            <div class="choice-group">
              <label class="choice"><input type="radio" name="gender" value="male" {% if user.gender=='male' %}checked{%
                  endif %}>男</label>
              <label class="choice"><input type="radio" name="gender" value="female" {% if user.gender=='female'
                  %}checked{% endif %}>女</label>
            </div>
          </div>
          <div class="field">
            <label for="age">年龄</label>
            <input id="age" name="age" type="number" min="10" max="120" value="{{ user.age }}" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="height">身高 (cm)</label>
            <input id="height" name="height" type="number" min="50" max="250" step="0.1" value="{{ user.height }}"
              required>
          </div>
          <div class="field">
            <label for="weight">当前体重 (kg)</label>
            <input id="weight" name="weight" type="number" min="20" max="300" step="0.1" value="{{ profile_weight }}"
              required>
          </div>
        </div>

        <div class="field">
          <label>活动量等级</label>
          <select name="activity_level" required>
            <option value="sedentary" {% if user.activity_level=='sedentary' %}selected{% endif %}>静坐（几乎不运动）</option>
            <option value="light" {% if user.activity_level=='light' %}selected{% endif %}>轻度运动（每周 1-3 次）</option>
            <option value="moderate" {% if user.activity_level=='moderate' %}selected{% endif %}>中度运动（每周 3-5 次）</option>
            <option value="active" {% if user.activity_level=='active' %}selected{% endif %}>重度运动（每周 6-7 次）</option>
            <option value="very_active" {% if user.activity_level=='very_active' %}selected{% endif %}>极高强度（体力工作 + 高频训练）
            </option>
          </select>
        </div>

        <div class="field">
          <label>健身目标</label>
          <div class="choice-group">
            <label class="choice"><input type="radio" name="fitness_goal" value="cut" {% if user.fitness_goal=='cut'
                %}checked{% endif %}>减脂</label>
            <label class="choice"><input type="radio" name="fitness_goal" value="maintain" {% if
                user.fitness_goal=='maintain' %}checked{% endif %}>维持</label>
            <label class="choice"><input type="radio" name="fitness_goal" value="bulk" {% if user.fitness_goal=='bulk'
                %}checked{% endif %}>增肌</label>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-block">保存档案，生成我的计划</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap foot-row">
      <span>练迹 TRAINFLOW</span>
      <span>新纪元技职与推广教育学院 · Python Programming 课程项目</span>
    </div>
  </footer>

</body>

</html>
